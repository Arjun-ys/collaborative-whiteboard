services:
  app:
    build: .
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      PORT: 5001
      MONGO_URI: mongodb://mongo:27017/collaborative-whiteboard
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 45s
  mongo:
    image: mongo:8.0
    volumes:
      - board-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  board-data:
